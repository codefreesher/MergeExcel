name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $config = Get-Content app\config.py -Raw
          $config = $config -replace 'VERSION = "[^"]+"', "VERSION = `"$version`""
          Set-Content app\config.py $config -Encoding utf8

      - name: Compile protected application with Nuitka
        run: >-
          python -m nuitka
          --mode=onefile
          --enable-plugin=pyside6
          --windows-console-mode=disable
          --assume-yes-for-downloads
          --include-data-dir=app/resources=app/resources
          --output-dir=dist
          --output-filename=ExcelMergerPro.exe
          main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: iscc "/DAppVersion=$env:APP_VERSION" installer\installer.iss

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $file = "installer-output\ExcelMergerPro-Setup-$env:APP_VERSION.exe"
          (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() | Set-Content "$file.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer-output/ExcelMergerPro-Setup-${{ env.APP_VERSION }}.exe
            installer-output/ExcelMergerPro-Setup-${{ env.APP_VERSION }}.exe.sha256
